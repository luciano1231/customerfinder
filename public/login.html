<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospector Pro - Ingresar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .login-card { width: min(380px, 100%); }
        .login-card h1 { font-size: 1.5rem; margin-bottom: 0.4rem; color: var(--accent); }
        #msg { min-height: 1.3em; margin-top: 0.8rem; color: #f87171; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="login-wrap">
    <form class="card glass-effect login-card" id="form">
        <h1>Prospector Pro</h1>
        <p class="text-muted text-sm" id="subtitle">Ingresá tu contraseña.</p>
        <div class="form-group mt-2">
            <label for="pwd">Contraseña</label>
            <input type="password" id="pwd" autocomplete="current-password" autofocus>
        </div>
        <div class="form-group" id="pwd2-group" style="display:none">
            <label for="pwd2">Repetir contraseña</label>
            <input type="password" id="pwd2" autocomplete="new-password">
        </div>
        <button class="btn-primary" id="btn">Ingresar</button>
        <p id="msg"></p>
    </form>
</div>
<script>
    const $ = id => document.getElementById(id);
    let modo = 'login';
    fetch('/api/auth_status').then(r => r.json()).then(s => {
        if (s.logueado) return location.href = '/';
        if (!s.configurada) {
            if (s.local) {
                modo = 'setup';
                $('subtitle').textContent = 'Primera vez: creá una contraseña para proteger el panel (la vas a usar también desde el celular).';
                $('pwd2-group').style.display = '';
                $('pwd').autocomplete = 'new-password';
                $('btn').textContent = 'Crear contraseña';
            } else {
                $('subtitle').textContent = 'Todavía no hay contraseña. Creala primero desde la PC (http://localhost:5000).';
                $('btn').disabled = true;
            }
        }
    });
    $('form').addEventListener('submit', async e => {
        e.preventDefault();
        const password = $('pwd').value;
        if (modo === 'setup' && password !== $('pwd2').value) return $('msg').textContent = 'Las contraseñas no coinciden.';
        $('btn').disabled = true;
        const r = await fetch(modo === 'setup' ? '/api/setup' : '/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password })
        }).then(r => r.json());
        $('btn').disabled = false;
        if (r.success) location.href = '/';
        else $('msg').textContent = r.error;
    });
</script>
</body>
</html>
